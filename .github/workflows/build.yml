name: Gerar APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar
        run: gradle assembleDebug --no-daemon

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk JA-Launcher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: JA-Launcher
          path: JA-Launcher.apk

      - name: Publicar na página de Releases
        if: github.event_name != 'pull_request'
        # Ação de terceiro fixada pela versão exata (v2.6.2), para não mudar sozinha.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: latest
          name: JA Launcher (última versão)
          files: JA-Launcher.apk
          make_latest: true

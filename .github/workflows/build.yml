name: Gerar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extrair projeto
        run: |
          if [ ! -f settings.gradle ]; then
            echo "$SRC" | base64 -d | tar -xz
          fi
        env:
          SRC: 

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar
        run: gradle assembleDebug --no-daemon

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk JA-Launcher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: JA-Launcher
          path: JA-Launcher.apk

      - name: Publicar na página de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: JA Launcher (última versão)
          files: JA-Launcher.apk
          make_latest: true
